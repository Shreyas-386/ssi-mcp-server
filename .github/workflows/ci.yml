name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ssi-mcp-server:ci .

      - name: Smoke test container
        env:
          SSI_API_KEY: ci-downstream-key
          MCP_AUTH_TOKEN: ci-client-token
        run: |
          cid=$(docker run -d \
            -e SSI_API_KEY \
            -e MCP_AUTH_TOKEN \
            -e ENVIRONMENT=staging \
            -p 18080:8080 \
            ssi-mcp-server:ci)
          trap "docker rm -f $cid" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
