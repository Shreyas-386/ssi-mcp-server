# Local smoke test for the HTTP transport (not for production secrets).
# Usage:  docker compose up --build -d

services:
  ssi-mcp-server:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUIRE_CLIENT_AUTH: ${REQUIRE_CLIENT_AUTH:-false}
      SSI_API_BASE_URL: ${SSI_API_BASE_URL:-https://dailygraphs.finsoftai.com}
      SSI_API_KEY: ${SSI_API_KEY:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    restart: unless-stopped
